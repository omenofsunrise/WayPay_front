name: Deploy with Environment Config

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Setup staging environment
        if: github.ref == 'refs/heads/dev'
        run: |
          cp .env.staging .env
          echo "Using STAGING environment variables:"
          cat .env | grep REACT_APP_

      - name: Setup production environment
        if: github.ref == 'refs/heads/main'
        run: |
          cp .env.production .env
          echo "Using PRODUCTION environment variables:"
          cat .env | grep REACT_APP_

      - name: Build (Staging mode for dev branch)
        if: github.ref == 'refs/heads/dev'
        run: npm run build:staging

      - name: Build (Production mode for main branch)
        if: github.ref == 'refs/heads/main'
        run: npm run build

      - name: Install sshpass (for password auth)
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Production (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          sshpass -p "${{ secrets.PROD_SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no -r dist/* ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}

      - name: Deploy to Staging (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: |
          sshpass -p "${{ secrets.STAGING_SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no -r dist/* ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}:${{ secrets.STAGING_DEPLOY_PATH }}